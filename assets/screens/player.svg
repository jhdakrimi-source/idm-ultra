<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <!-- Video background -->
  <rect width="390" height="844" fill="#000"/>
  <defs>
    <clipPath id="vidClip"><rect x="0" y="0" width="390" height="844"/></clipPath>
    <linearGradient id="topV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0.75"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <linearGradient id="botV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.9"/></linearGradient>
  </defs>
  <g clip-path="url(#vidClip)">
    <image x="0" y="0" width="390" height="844" preserveAspectRatio="xMidYMid slice" href="https://image.tmdb.org/t/p/w780/8b8R8l88Qje9dn9OE8PY05Nxl1X.jpg"/>
    <rect x="0" y="0" width="390" height="844" fill="#000" fill-opacity="0.35"/>
  </g>
  <!-- Vignette top/bottom -->
  <rect x="0" y="0" width="390" height="120" fill="url(#topV)"/>
  <rect x="0" y="620" width="390" height="224" fill="url(#botV)"/>
  <!-- Back button -->
  <rect x="16" y="48" width="40" height="40" rx="14" fill="#000" fill-opacity="0.5"/>
  <text x="36" y="74" font-family="Inter, sans-serif" font-size="18" fill="#fff" text-anchor="middle">&#x2190;</text>
  <!-- Title -->
  <text x="70" y="74" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#fff">Dune: Part Two · 4K</text>
  <!-- Center play -->
  <circle cx="195" cy="360" r="46" fill="#fff" fill-opacity="0.14" stroke="#fff" stroke-opacity="0.3" stroke-width="1.5"/>
  <text x="195" y="374" font-family="Inter, sans-serif" font-size="30" fill="#fff" text-anchor="middle">&#x25B6;</text>
  <!-- Subtitle -->
  <text x="195" y="500" font-family="Inter, sans-serif" font-size="17" font-weight="800" fill="#fff" text-anchor="middle">The desert takes what it wants.</text>
  <!-- Bottom controls -->
  <text x="26" y="712" font-family="Inter, sans-serif" font-size="12" fill="#fff">1:02:45</text>
  <text x="364" y="712" font-family="Inter, sans-serif" font-size="12" fill="#8A8A8E" text-anchor="end">2:46:00</text>
  <rect x="26" y="724" width="338" height="3" rx="1.5" fill="#3A3A3A"/>
  <rect x="26" y="724" width="180" height="3" rx="1.5" fill="#FF7A1A"/>
  <circle cx="206" cy="725" r="6" fill="#FF7A1A"/>
  <!-- Control buttons row -->
  <text x="44" y="770" font-family="Inter, sans-serif" font-size="18" fill="#fff" text-anchor="middle">&#x21B4;</text>
  <circle cx="150" cy="762" r="18" fill="#fff" fill-opacity="0.1"/>
  <text x="150" y="770" font-family="Inter, sans-serif" font-size="16" fill="#fff" text-anchor="middle">&#x25B6;</text>
  <text x="240" y="770" font-family="Inter, sans-serif" font-size="18" fill="#fff" text-anchor="middle">&#x21B5;</text>
  <text x="300" y="770" font-family="Inter, sans-serif" font-size="16" fill="#fff" text-anchor="middle">&#x1F4AC;</text>
  <text x="352" y="770" font-family="Inter, sans-serif" font-size="16" fill="#fff" text-anchor="middle">&#x2699;</text>
</svg>